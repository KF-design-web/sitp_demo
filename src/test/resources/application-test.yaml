spring:
  datasource:
    url: jdbc:h2:mem:sitp_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  mail:
    host: localhost
    port: 3025
    test-connection: false

app:
  mail:
    enabled: false  # tests: codes stay in the console, no SMTP attempt
